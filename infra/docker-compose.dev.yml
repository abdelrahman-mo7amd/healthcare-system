# Development stack with live hot-reloading. Source code is bind-mounted
# into each container so local edits are picked up immediately by
# nodemon (backend/appointment-service) and Vite's dev server
# (frontend) -- no image rebuild needed while iterating.
#
# Usage:  cd infra && docker compose -f docker-compose.dev.yml up
version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: healthcare-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db

  backend:
    image: node:20-alpine
    working_dir: /app
    container_name: healthcare-backend-dev
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/healthcare
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ../backend:/app
      - backend-node-modules:/app/node_modules
    ports:
      - "5000:5000"

  appointment-service:
    image: node:20-alpine
    working_dir: /app
    container_name: healthcare-appointment-service-dev
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/healthcare_appointments
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ../microservices/appointment-service:/app
      - appointment-node-modules:/app/node_modules
    ports:
      - "5001:5001"

  frontend:
    image: node:20-alpine
    working_dir: /app
    container_name: healthcare-frontend-dev
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
      - appointment-service
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_APPOINTMENT_API_URL: http://localhost:5001/api
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  mongo-dev-data:
  backend-node-modules:
  appointment-node-modules:
  frontend-node-modules:
