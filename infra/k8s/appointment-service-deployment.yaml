apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  # Independently scalable: bump this replica count during peak
  # scheduling hours without touching the backend or frontend.
  replicas: 3
  selector:
    matchLabels: { app: appointment-service }
  template:
    metadata:
      labels: { app: appointment-service }
    spec:
      containers:
        - name: appointment-service
          image: hospital-appointment-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 5001 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          envFrom:
            - secretRef: { name: healthcare-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
spec:
  selector: { app: appointment-service }
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appointment-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: appointment-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
