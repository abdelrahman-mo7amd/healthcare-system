server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file (e.g. /login,
    # /patients, /appointments) is served index.html so React Router
    # can handle the route client-side, instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
